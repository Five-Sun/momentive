spring:
  application:
    name: momentive-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/momentive
    username: momentive
    password: momentive
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    placeholders:
      # 관리자로 승격할 계정 이메일. 리포지토리가 public이라 실제 값은 남기지 않고 환경변수로만 주입한다.
      # 미설정 시 빈 문자열이 되어 V13 마이그레이션이 0행 갱신(no-op)으로 지나간다.
      adminEmail: ${MOMENTIVE_ADMIN_EMAIL:}

server:
  port: 8081

momentive:
  cors:
    allowed-origins: ${MOMENTIVE_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    secret: ${MOMENTIVE_JWT_SECRET:local-dev-only-secret-key-please-override-in-prod-32bytes+}
  cookie:
    secure: ${MOMENTIVE_COOKIE_SECURE:false}
  toss:
    base-url: ${MOMENTIVE_TOSS_BASE_URL:https://api.tosspayments.com}
    secret-key: ${MOMENTIVE_TOSS_SECRET_KEY:test_sk_dummy_for_local_dev}
  cloudinary:
    # 리포지토리가 public이라 실제 자격증명은 남기지 않고 환경변수로만 주입한다.
    # 미설정 시 빈 문자열이 되어 기동/테스트는 정상 진행되고, 실제 업로드만 Cloudinary가 거부한다.
    cloud-name: ${MOMENTIVE_CLOUDINARY_CLOUD_NAME:}
    api-key: ${MOMENTIVE_CLOUDINARY_API_KEY:}
    api-secret: ${MOMENTIVE_CLOUDINARY_API_SECRET:}
    upload-folder: ${MOMENTIVE_CLOUDINARY_UPLOAD_FOLDER:momentive/products}
