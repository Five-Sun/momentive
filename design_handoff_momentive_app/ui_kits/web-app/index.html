<!-- @dsCard group="Web App" viewport="1440x900" name="Momentive Web (Responsive)" subtitle="Desktop top-nav ↔ Mobile bottom-nav, same components" -->
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Momentive — Responsive</title>
<link rel="stylesheet" href="../../styles.css">
<style>
  *{box-sizing:border-box}
  body{margin:0;background:var(--canvas);font-family:var(--font-body);color:var(--ink)}
  .app{min-height:100vh;display:flex;flex-direction:column}
  .topnav{display:none}
  .content{flex:1;padding-bottom:64px}
  .hscroll{display:flex;gap:12px;overflow-x:auto}
  .hscroll::-webkit-scrollbar{display:none}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .bottomnav{position:sticky;bottom:0}
  .container{padding:0 16px}
  .home-layout{display:block}
  .cat-rail{display:flex;gap:10px;overflow-x:auto;padding:0 16px 16px}
  @media (min-width:1024px){
    .topnav{display:flex}
    .bottomnav{display:none}
    .content{padding-bottom:0}
    .container{max-width:1400px;margin:0 auto;padding:0 40px}
    .grid{grid-template-columns:repeat(2,1fr);gap:40px}
    .hero{padding:0 !important;margin:0 !important;border-radius:0 !important}
    .mobile-search-row{display:none}
    .cat-rail{max-width:1400px;margin:0 auto;padding:28px 40px;gap:32px;overflow-x:visible}
  }
  .cat-grid{display:flex;flex-direction:column;gap:12px}
  .cart-layout{display:flex;flex-direction:column;gap:20px}
  .my-menu{display:flex;flex-direction:column}
  .my-stats{display:flex}
  @media (min-width:1024px){
    .cat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
    .cart-layout{display:grid;grid-template-columns:1fr 340px;gap:40px;align-items:start}
    .my-menu{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  }
</style>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../_preview_bundle.js"></script>
<script src="./image-slot.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/plain" id="app-src">
const { Toast, BottomNav, Rating, ProductCard, Badge, Chip, ShippingProgress } = window.Momentive;
const fmt = n => n.toLocaleString('ko-KR') + '원';

function TopNav({ tab, setTab, cartCount, q, setQ, onSearch }) {
  const links = [['home','홈'],['category','카테고리'],['wishlist','위시'],['my','마이']];
  return (
    <div className="topnav" style={{ alignItems:'center', justifyContent:'space-between', height:80, borderBottom:'1px solid var(--hairline)', padding:'0 48px' }}>
      <div style={{ display:'flex', alignItems:'center', gap:56 }}>
        <img src="../../assets/logo/momentive-logo.jpeg" style={{ width:38, height:38, borderRadius:'50%' }} alt="momentive" />
        <div style={{ display:'flex', gap:36 }}>
          {links.map(([k,l]) => (
            <button key={k} onClick={() => setTab(k)} style={{ background:'none', border:'none', cursor:'pointer', font:'var(--text-body)', fontWeight: tab===k?700:400, color: tab===k?'var(--brand-pink-active)':'var(--ink)' }}>{l}</button>
          ))}
        </div>
      </div>
      <div style={{ display:'flex', alignItems:'center', gap:22 }}>
        <div style={{ display:'flex', alignItems:'center', gap:8, height:42, width:300, padding:'0 18px', borderRadius:'var(--radius-full)', background:'var(--surface-soft)', border:'1px solid var(--hairline)' }}>
          <span style={{ color:'var(--muted)' }}>⌕</span>
          <input value={q} onChange={e=>setQ(e.target.value)} onKeyDown={e=>e.key==='Enter' && onSearch()} placeholder="브랜드, 상품 검색" style={{ border:'none', outline:'none', background:'transparent', flex:1, font:'var(--text-body-sm)', color:'var(--ink)' }} />
        </div>
        <button onClick={() => setTab('cart')} style={{ position:'relative', background:'none', border:'none', fontSize:20, cursor:'pointer' }}>
          🛍
          {cartCount>0 && <span style={{ position:'absolute', top:-4, right:-8, background:'var(--brand-pink-active)', color:'#fff', borderRadius:999, fontSize:10, padding:'1px 5px', fontWeight:700 }}>{cartCount}</span>}
        </button>
      </div>
    </div>
  );
}

function Header({ title, onBack, right }) {
  return (
    <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', height:52, padding:'0 16px', background:'var(--surface-card)', borderBottom:'1px solid var(--hairline)' }}>
      <div style={{ width:32 }}>{onBack && <button onClick={onBack} style={{ background:'none', border:'none', fontSize:20, cursor:'pointer', color:'var(--ink)' }}>‹</button>}</div>
      <span style={{ font:'var(--text-title-sm)', color:'var(--ink)' }}>{title}</span>
      <div style={{ width:32, display:'flex', justifyContent:'flex-end' }}>{right}</div>
    </div>
  );
}

function MiniCard({ product, favorited, onToggleFav, onSelect }) {
  return (
    <div onClick={() => onSelect(product)} style={{ width:140, flexShrink:0, cursor:'pointer', display:'flex', flexDirection:'column', gap:6 }}>
      <div style={{ position:'relative', aspectRatio:'1', borderRadius:'var(--radius-md)', overflow:'hidden', background:'var(--surface-strong)' }}>
        <image-slot id={`mini-${product.id}`} placeholder={product.title}></image-slot>
        <button onClick={(e)=>{e.stopPropagation(); onToggleFav(product.id);}} style={{ position:'absolute', top:8, right:8, width:26, height:26, borderRadius:'50%', border:'none', background:'rgba(255,255,255,.92)', color: favorited?'var(--brand-pink-active)':'var(--muted)', cursor:'pointer', fontSize:13 }}>♥</button>
      </div>
      <span style={{ font:'var(--text-caption)', color:'var(--ink)', fontWeight:600, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{product.title}</span>
      <span style={{ font:'var(--text-body-sm)', color:'var(--ink)', fontWeight:700 }}>{product.price}</span>
    </div>
  );
}

function Home({ products, favorites, onToggleFav, onSelect, category, setCategory, recentlyViewed, q, setQ, onSearch }) {
  const cats = ['전체','아우터','니트','이너웨어','악세서리'];
  const filtered = category==='전체' ? products : products.filter(p=>p.category===category);
  const picks = [...products].sort((a,b)=>b.reviews-a.reviews).slice(0,4);
  return (
    <div>
      <div className="mobile-search-row container" style={{ padding:'14px 16px 0' }}>
        <div onClick={onSearch} style={{ display:'flex', alignItems:'center', gap:8, height:44, padding:'0 16px', borderRadius:'var(--radius-full)', background:'var(--surface-soft)', border:'1px solid var(--hairline)', color:'var(--muted)', font:'var(--text-body-sm)' }}>
          <span>⌕</span><span>브랜드, 상품 검색</span>
        </div>
      </div>
      <div className="hero" style={{ margin:'16px', padding:28, borderRadius:'var(--radius-lg)', background:'var(--surface-strong)', position:'relative', minHeight:220, display:'flex', alignItems:'flex-start' }}>
        <image-slot id="hero-banner" placeholder="시즌 룩북 이미지" style={{ position:'absolute', inset:0 }}></image-slot>
        <div style={{ position:'relative', display:'flex', flexDirection:'column', gap:4, padding:12 }}>
          <span style={{ font:'var(--text-display-md)', color:'var(--ink)' }}>소중한 순간을 위한 옷</span>
          <span style={{ font:'var(--text-body-sm)', color:'var(--body)' }}>겨울 신상 컬렉션 만나보기</span>
        </div>
      </div>
      <div className="cat-rail">
        {cats.map(c => <Chip key={c} label={c} selected={category===c} onClick={()=>setCategory(c)} />)}
      </div>
      <div className="container home-layout" style={{ paddingTop:8, paddingBottom:32 }}>
        <div>
          <div style={{ paddingBottom:10, display:'flex', alignItems:'baseline', justifyContent:'space-between' }}>
            <span style={{ font:'var(--text-title-sm)', color:'var(--ink)' }}>지금 인기 있는</span>
          </div>
          <div className="hscroll" style={{ paddingBottom:28 }}>
            {picks.map(p => <MiniCard key={p.id} product={p} favorited={favorites.includes(p.id)} onToggleFav={onToggleFav} onSelect={onSelect} />)}
          </div>
          <div className="grid">
            {filtered.map(p => (
              <div key={p.id} onClick={()=>onSelect(p)} style={{ cursor:'pointer' }}>
                <ProductCard image={<image-slot id={`home-${p.id}`} placeholder={p.title}></image-slot>} title={p.title} price={p.price} originalPrice={p.originalPrice}
                  badge={p.badge && <Badge label={p.badge} tone={p.badgeTone} />} favorited={favorites.includes(p.id)} onToggleFavorite={()=>onToggleFav(p.id)}
                  rating={<Rating value={p.rating} count={p.reviews} />} />
              </div>
            ))}
          </div>
          {recentlyViewed.length>0 && (
            <div style={{ margin:'32px 0' }}>
              <div style={{ paddingBottom:10 }}><span style={{ font:'var(--text-title-sm)', color:'var(--ink)' }}>최근 본 상품</span></div>
              <div className="hscroll">{recentlyViewed.map(p => <MiniCard key={p.id} product={p} favorited={favorites.includes(p.id)} onToggleFav={onToggleFav} onSelect={onSelect} />)}</div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function ProductDetail({ product, favorited, onToggleFav, onBack, onAddToCart }) {
  const { SizeSelector, Button, IconButton } = window.Momentive;
  const [size, setSize] = React.useState(product.sizes[1]);
  return (
    <div className="container" style={{ display:'grid', gridTemplateColumns:'1fr', gap:0 }}>
      <div className="pd-grid" style={{ display:'grid', gridTemplateColumns:'1fr', gap:24, padding:'16px 0' }}>
        <div style={{ position:'relative', aspectRatio:'1', borderRadius:'var(--radius-md)', overflow:'hidden', background:'var(--surface-strong)' }}>
          <image-slot id={`pd-${product.id}`} placeholder={product.title}></image-slot>
          {product.badge && <div style={{ position:'absolute', top:12, left:12 }}><Badge label={product.badge} tone={product.badgeTone} /></div>}
        </div>
        <div style={{ display:'flex', flexDirection:'column', gap:10 }}>
          <button onClick={onBack} style={{ alignSelf:'flex-start', background:'none', border:'none', color:'var(--muted)', cursor:'pointer', font:'var(--text-caption)' }}>‹ 목록으로</button>
          <span style={{ font:'var(--text-title)', color:'var(--ink)' }}>{product.title}</span>
          <Rating value={product.rating} count={product.reviews} />
          <div style={{ display:'flex', alignItems:'baseline', gap:8 }}>
            {product.originalPrice && <span style={{ font:'var(--text-body-sm)', color:'var(--muted-soft)', textDecoration:'line-through' }}>{product.originalPrice}</span>}
            <span style={{ font:'var(--text-display-md)', color:'var(--ink)' }}>{product.price}</span>
          </div>
          <div style={{ height:1, background:'var(--hairline)', margin:'6px 0' }} />
          <span style={{ font:'var(--text-title-sm)', color:'var(--ink)' }}>사이즈</span>
          <SizeSelector sizes={product.sizes} selected={size} onSelect={setSize} />
          <p style={{ font:'var(--text-body)', color:'var(--body)' }}>{product.description}</p>
          <div style={{ display:'flex', gap:10, marginTop:8 }}>
            <Button variant="secondary" onClick={onToggleFav} icon="♥">{favorited?'위시 완료':'위시 담기'}</Button>
            <Button variant="primary" onClick={()=>onAddToCart(product,size)}>장바구니 담기</Button>
          </div>
        </div>
      </div>
    </div>
  );
}

function CategoryScreen({ onSelect }) {
  const cats = [
    { key:'아우터', desc:'패딩 · 코트 · 후드집업' },
    { key:'니트', desc:'스웨터 · 가디건' },
    { key:'이너웨어', desc:'티셔츠 · 레이어드' },
    { key:'악세서리', desc:'비니 · 스카프' },
  ];
  return (
    <div className="container" style={{ padding:'20px 16px' }}>
      <div style={{ paddingBottom:14 }}><span style={{ font:'var(--text-title-sm)', color:'var(--ink)' }}>카테고리</span></div>
      <div className="cat-grid">
        {cats.map(c => (
          <button key={c.key} onClick={()=>onSelect(c.key)} style={{ display:'flex', alignItems:'center', gap:14, height:88, padding:'0 18px', borderRadius:'var(--radius-md)', border:'1px solid var(--hairline)', background:'var(--surface-card)', cursor:'pointer', textAlign:'left' }}>
            <div style={{ width:52, height:52, borderRadius:'var(--radius-sm)', background:'var(--surface-strong)', flexShrink:0 }} />
            <div style={{ display:'flex', flexDirection:'column', gap:2 }}>
              <span style={{ font:'var(--text-title-sm)', color:'var(--ink)' }}>{c.key}</span>
              <span style={{ font:'var(--text-caption)', color:'var(--muted)' }}>{c.desc}</span>
            </div>
          </button>
        ))}
      </div>
    </div>
  );
}

function CartScreen({ cart, onQty, onRemove, onCheckout }) {
  const { Button } = window.Momentive;
  const subtotal = cart.reduce((s,c)=>s+c.unitPrice*c.qty,0);
  const shipping = subtotal>0 && subtotal<50000 ? 3000 : 0;
  const remaining = Math.max(0, 50000-subtotal);
  return (
    <div className="container" style={{ padding:'20px 16px' }}>
      <div style={{ paddingBottom:14 }}><span style={{ font:'var(--text-title-sm)', color:'var(--ink)' }}>장바구니</span></div>
      {cart.length===0 && <div style={{ textAlign:'center', marginTop:60, font:'var(--text-body-sm)', color:'var(--muted)' }}>장바구니가 비어있어요, 마음에 드는 옷을 담아보세요</div>}
      {cart.length>0 && (
        <div className="cart-layout">
          <div style={{ display:'flex', flexDirection:'column', gap:16 }}>
            <ShippingProgress remaining={remaining} formatAmount={fmt} />
            {cart.map(c => (
              <div key={c.key} style={{ display:'flex', gap:12 }}>
                <div style={{ width:84, height:84, borderRadius:'var(--radius-sm)', overflow:'hidden', flexShrink:0 }}><image-slot id={`cart-${c.key}`} placeholder={c.title}></image-slot></div>
                <div style={{ flex:1, display:'flex', flexDirection:'column', gap:6 }}>
                  <span style={{ font:'var(--text-title-sm)', color:'var(--ink)' }}>{c.title}</span>
                  <span style={{ font:'var(--text-caption)', color:'var(--muted)' }}>사이즈: {c.size}</span>
                  <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between' }}>
                    <div style={{ display:'flex', alignItems:'center', gap:10, border:'1px solid var(--hairline)', borderRadius:'var(--radius-full)', padding:'2px 4px' }}>
                      <button onClick={()=>onQty(c.key,-1)} style={{ width:22, height:22, border:'none', background:'none', cursor:'pointer' }}>−</button>
                      <span style={{ font:'var(--text-body-sm)' }}>{c.qty}</span>
                      <button onClick={()=>onQty(c.key,1)} style={{ width:22, height:22, border:'none', background:'none', cursor:'pointer' }}>+</button>
                    </div>
                    <span style={{ font:'var(--text-price)', color:'var(--ink)' }}>{fmt(c.unitPrice*c.qty)}</span>
                  </div>
                </div>
                <button onClick={()=>onRemove(c.key)} style={{ alignSelf:'flex-start', background:'none', border:'none', color:'var(--muted-soft)', cursor:'pointer', fontSize:16 }}>✕</button>
              </div>
            ))}
          </div>
          <div style={{ display:'flex', flexDirection:'column', gap:14, padding:20, borderRadius:'var(--radius-md)', background:'var(--surface-soft)', position:'sticky', top:20 }}>
            <div style={{ display:'flex', justifyContent:'space-between', font:'var(--text-body-sm)', color:'var(--body)' }}><span>상품 금액</span><span>{fmt(subtotal)}</span></div>
            <div style={{ display:'flex', justifyContent:'space-between', font:'var(--text-body-sm)', color:'var(--body)' }}><span>배송비</span><span>{shipping?fmt(shipping):'무료'}</span></div>
            <div style={{ height:1, background:'var(--hairline)' }} />
            <div style={{ display:'flex', justifyContent:'space-between', font:'var(--text-title-sm)', color:'var(--ink)' }}><span>총 결제금액</span><span>{fmt(subtotal+shipping)}</span></div>
            <Button variant="primary" onClick={onCheckout}>결제하기</Button>
          </div>
        </div>
      )}
    </div>
  );
}

function MyScreen({ favoritesCount, cartCount }) {
  const menu = ['배송 조회','쿠폰함','적립금','반려견 프로필 관리','고객센터'];
  return (
    <div className="container" style={{ padding:'20px 16px', display:'flex', flexDirection:'column', gap:20 }}>
      <div style={{ display:'flex', alignItems:'center', gap:14 }}>
        <div style={{ width:56, height:56, borderRadius:'50%', background:'var(--brand-pink-soft)', display:'flex', alignItems:'center', justifyContent:'center', font:'var(--text-title)', color:'var(--brand-pink-deep)' }}>🐾</div>
        <div style={{ display:'flex', flexDirection:'column' }}>
          <span style={{ font:'var(--text-title-sm)', color:'var(--ink)' }}>모모 보호자님</span>
          <span style={{ font:'var(--text-caption)', color:'var(--muted)' }}>momentive_official 회원</span>
        </div>
      </div>
      <div className="my-stats" style={{ borderRadius:'var(--radius-md)', background:'var(--surface-soft)', padding:'16px 0' }}>
        {[['주문내역','3'],['위시리스트',String(favoritesCount)],['장바구니',String(cartCount)]].map(([label,val]) => (
          <div key={label} style={{ flex:1, textAlign:'center', display:'flex', flexDirection:'column', gap:4 }}>
            <span style={{ font:'var(--text-title)', color:'var(--ink)' }}>{val}</span>
            <span style={{ font:'var(--text-caption)', color:'var(--muted)' }}>{label}</span>
          </div>
        ))}
      </div>
      <div className="my-menu">
        {menu.map(m => (
          <div key={m} style={{ display:'flex', alignItems:'center', justifyContent:'space-between', height:52, padding:'0 4px', borderBottom:'1px solid var(--hairline)', font:'var(--text-body)', color:'var(--body)' }}>
            {m}<span style={{ color:'var(--muted)' }}>›</span>
          </div>
        ))}
      </div>
    </div>
  );
}

const PRODUCTS = [
  { id:1, title:'플리스 후드 집업', category:'아우터', price:'38,000원', originalPrice:'48,000원', unitPrice:38000, badge:'-20%', badgeTone:'sale', rating:4.8, reviews:132, sizes:['XS','S','M','L','XL'], description:'보들보들한 플리스 소재로 산책부터 실내까지 편안하게.' },
  { id:2, title:'베이직 니트 스웨터', category:'니트', price:'29,000원', unitPrice:29000, badge:'NEW', badgeTone:'new', rating:4.9, reviews:88, sizes:['XS','S','M','L'], description:'얇지만 보온성이 좋은 니트 소재.' },
  { id:3, title:'레인코트 판초', category:'아우터', price:'32,000원', unitPrice:32000, rating:4.6, reviews:41, sizes:['S','M','L','XL'], description:'방수 소재로 비 오는 날 산책도 걱정 없이.' },
  { id:4, title:'스트라이프 이너 티', category:'이너웨어', price:'19,000원', unitPrice:19000, badge:'BEST', badgeTone:'neutral', rating:4.7, reviews:205, sizes:['XS','S','M','L','XL'], description:'얇은 코튼 소재의 이너웨어.' },
  { id:5, title:'폼폼 니트 비니', category:'악세서리', price:'15,000원', unitPrice:15000, rating:4.9, reviews:63, sizes:['S','M'], description:'귀 구멍이 있는 니트 비니.' },
  { id:6, title:'바람막이 자켓', category:'아우터', price:'35,000원', unitPrice:35000, badge:'NEW', badgeTone:'new', rating:4.5, reviews:27, sizes:['XS','S','M','L','XL'], description:'가벼운 바람막이 소재.' },
];

function App(){
  const [tab, setTab] = React.useState('home');
  const [category, setCategory] = React.useState('전체');
  const [favorites, setFavorites] = React.useState([2,4]);
  const [cart, setCart] = React.useState([]);
  const [active, setActive] = React.useState(null);
  const [toast, setToast] = React.useState('');
  const [recentlyViewed, setRecentlyViewed] = React.useState([]);
  const [q, setQ] = React.useState('');

  const flash = m => { setToast(m); setTimeout(()=>setToast(''),1800); };
  const toggleFav = id => setFavorites(f => f.includes(id) ? f.filter(x=>x!==id) : [...f,id]);
  const addToCart = (product,size) => {
    const key = product.id+'-'+size;
    setCart(c => { const e=c.find(x=>x.key===key); if(e) return c.map(x=>x.key===key?{...x,qty:x.qty+1}:x); return [...c,{key,id:product.id,title:product.title,size,unitPrice:product.unitPrice,qty:1}]; });
    flash('장바구니에 담았어요');
  };
  const qtyChange = (key,d) => setCart(c => c.map(x => x.key===key ? {...x, qty:Math.max(1,x.qty+d)} : x));
  const removeItem = key => setCart(c => c.filter(x=>x.key!==key));
  const openProduct = p => { setActive(p); setTab('detail'); setRecentlyViewed(rv => [p, ...rv.filter(x=>x.id!==p.id)].slice(0,8)); };
  const cartCount = cart.reduce((s,c)=>s+c.qty,0);

  const tabs = [['home','⌂','홈'],['category','▤','카테고리'],['wishlist','♥','위시'],['my','☺','마이']];

  let content;
  if (tab==='home') content = <Home products={PRODUCTS} favorites={favorites} onToggleFav={toggleFav} onSelect={openProduct} category={category} setCategory={setCategory} recentlyViewed={recentlyViewed} q={q} setQ={setQ} onSearch={()=>{}} />;
  else if (tab==='detail') content = <ProductDetail product={active} favorited={favorites.includes(active.id)} onToggleFav={()=>toggleFav(active.id)} onBack={()=>setTab('home')} onAddToCart={addToCart} />;
  else if (tab==='category') content = <CategoryScreen onSelect={(c)=>{ setCategory(c); setTab('home'); }} />;
  else if (tab==='wishlist') {
    const wished = PRODUCTS.filter(p=>favorites.includes(p.id));
    content = <div className="container" style={{padding:16}}>
      {wished.length===0 && <div style={{ textAlign:'center', marginTop:60, font:'var(--text-body-sm)', color:'var(--muted)' }}>위시리스트가 비어있어요, 마음에 드는 옷을 담아보세요</div>}
      <div className="grid">{wished.map(p=>(<div key={p.id} onClick={()=>openProduct(p)} style={{cursor:'pointer'}}><ProductCard image={<image-slot id={`w-${p.id}`} placeholder={p.title}></image-slot>} title={p.title} price={p.price} favorited={true} onToggleFavorite={()=>toggleFav(p.id)} rating={<Rating value={p.rating} count={p.reviews} />} /></div>))}</div>
    </div>;
  }
  else if (tab==='cart') content = <CartScreen cart={cart} onQty={qtyChange} onRemove={removeItem} onCheckout={()=>flash('주문이 완료되었어요 🤍')} />;
  else if (tab==='my') content = <MyScreen favoritesCount={favorites.length} cartCount={cartCount} />;

  const showBottomNav = tab !== 'detail';

  return (
    <div className="app">
      <TopNav tab={tab} setTab={setTab} cartCount={cartCount} q={q} setQ={setQ} onSearch={()=>{}} />
      <div className="content">{content}</div>
      {showBottomNav && <div className="bottomnav"><BottomNav items={tabs.map(([key,icon,label])=>({key,icon,label}))} activeKey={tab} onSelect={setTab} /></div>}
      <Toast message={toast} visible={!!toast} />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<script>
  const { code } = Babel.transform(document.getElementById('app-src').textContent, { presets: [['react', { runtime: 'classic' }]] });
  (0, eval)(code);
</script>
</body>
</html>
