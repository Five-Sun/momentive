<!-- @dsCard group="Components" viewport="700x300" name="Core" subtitle="Button, IconButton, Badge, Chip" -->
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../_preview_bundle.js"></script>
<div id="root" style="font-family:var(--font-body);background:var(--canvas);padding:20px"></div>
<script type="text/plain" id="app-src">
const { Button, IconButton, Badge, Chip } = window.Momentive;
function Demo(){
  const [sel, setSel] = React.useState('outer');
  return (
    <div style={{display:'flex', flexDirection:'column', gap:16}}>
      <div style={{display:'flex', gap:10, flexWrap:'wrap'}}>
        <Button variant="primary">장바구니 담기</Button>
        <Button variant="secondary">전체보기</Button>
        <Button variant="ghost">취소</Button>
        <Button variant="primary" disabled>품절</Button>
      </div>
      <div style={{display:'flex', gap:10, alignItems:'center'}}>
        <IconButton>←</IconButton>
        <IconButton active>♥</IconButton>
        <IconButton variant="filled">⋯</IconButton>
      </div>
      <div style={{display:'flex', gap:8}}>
        <Badge label="NEW" tone="new" /><Badge label="-20%" tone="sale" /><Badge label="품절" tone="soldout" /><Badge label="BEST" tone="neutral" />
      </div>
      <div style={{display:'flex', gap:8}}>
        {['전체','아우터','니트','바람막이'].map(l => <Chip key={l} label={l} selected={sel===l} onClick={()=>setSel(l)} />)}
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
<script>
  const { code } = Babel.transform(document.getElementById('app-src').textContent, { presets: [['react', { runtime: 'classic' }]] });
  (0, eval)(code);
</script>
